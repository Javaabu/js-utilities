name: Publish to npm

# Publishes the package when a version tag (e.g. v2.35.0) is pushed.
# Uses npm trusted publishing, so no npm token is stored in the repo.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # lets npm verify this workflow through GitHub's OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # actions are pinned to exact commits so a changed tag upstream can't run here
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the job never pushes to git

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs
          registry-url: https://registry.npmjs.org
          package-manager-cache: false # no caches in a publish job

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm publish --access public

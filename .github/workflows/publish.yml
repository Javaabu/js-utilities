name: Publish to npm

# Publishes the package when a version tag (e.g. v2.35.0) is pushed.
# Uses npm trusted publishing, so no npm token is stored in the repo.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # lets npm verify this workflow through GitHub's OIDC token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm publish --access public
